<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima-App · Pronóstico Numérico Meteorológico</title>
    <meta name="description" content="Simulador 2D del pronóstico del clima mediante diferencias finitas (difusión térmica y advección por viento)." />
    <meta name="theme-color" content="#F5F5F5" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Aplica el tema guardado antes del primer pintado: evita el destello blanco/negro -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('clima-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var h = document.documentElement;
          h.classList.add(dark ? 'dark' : 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#141414' : '#F5F5F5');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="selection:bg-llanos-red selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
